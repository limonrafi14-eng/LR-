<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লিমন রেফ্রিজারেটর — মাসিক হিসাব</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4f7fb;color:#172033}header{background:#1267d6;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}.wrap{max-width:1000px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #18243b12;margin-bottom:12px}.stat b{display:block;font-size:24px;margin-top:5px}.stat span,.small{font-size:12px;color:#667085}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}button{border:0;border-radius:10px;padding:10px 13px;background:#1267d6;color:white;font-weight:600}button.secondary{background:#e9eef7;color:#1d3557}button.danger{background:#d92d20}button.green{background:#16834b}input{width:100%;padding:10px;border:1px solid #d6dce7;border-radius:9px;font-size:15px}label{font-size:13px;color:#475467;display:block;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 7px;border-bottom:1px solid #edf0f5;text-align:left}th{color:#667085;background:#f8fafc}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.paid{background:#dcfae6;color:#137333}.due{background:#fee4e2;color:#b42318}.hidden{display:none!important}.tablewrap{overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}table{min-width:760px}}@media(max-width:480px){.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="wrap" style="padding:0"><h1>লিমন রেফ্রিজারেটর</h1><div class="sub">অফলাইন মাসিক হিসাব সফটওয়্যার</div></div></header>
<div class="wrap">
<div class="tabs"><button onclick="tab('dash')">📊 হিসাব</button><button onclick="tab('customers')">👥 কাস্টমার</button><button onclick="tab('payments')">💰 মাসিক আদায়</button><button onclick="tab('expenses')">🧾 খরচ</button><button class="secondary" onclick="backup()">💾 Backup</button><button class="secondary" onclick="restore()">↩ Restore</button></div>
<section id="dash"><div class="card"><div class="row"><b>হিসাবের মাস</b><input id="month" type="month" style="width:auto" onchange="render()"></div></div>
<div class="grid"><div class="card stat"><span>মোট কাস্টমার</span><b id="sc">0</b></div><div class="card stat"><span>মাসিক ভাড়া</span><b id="sr">৳0</b></div><div class="card stat"><span>আদায়</span><b id="sp">৳0</b></div><div class="card stat"><span>বাকি</span><b id="sd">৳0</b></div></div>
<div class="card"><div class="row"><b>এই মাসের সারাংশ</b><button onclick="print()">🖨️ Print</button></div><p id="sum" class="small"></p></div></section>
<section id="customers" class="hidden"><div class="card"><h3>নতুন কাস্টমার যোগ</h3><div class="formgrid"><div><label>নাম</label><input id="n"></div><div><label>মোবাইল</label><input id="ph"></div><div><label>ফ্রিজ নম্বর</label><input id="fr" placeholder="FR-001"></div><div><label>ব্র্যান্ড</label><input id="br" placeholder="Walton"></div><div><label>মাসিক ভাড়া</label><input id="rent" type="number" value="500"></div><div><label>অগ্রিম</label><input id="adv" type="number" value="0"></div></div><br><button onclick="add()">➕ Save</button></div>
<div class="card"><div class="row"><b>কাস্টমার তালিকা</b><input id="search" placeholder="নাম/ফোন/ফ্রিজ" style="max-width:260px" oninput="customers()"></div><br><div class="tablewrap"><table><thead><tr><th>নাম</th><th>ফোন</th><th>ফ্রিজ</th><th>ভাড়া</th><th>অগ্রিম</th><th>অ্যাকশন</th></tr></thead><tbody id="cr"></tbody></table></div></div></section>
<section id="payments" class="hidden"><div class="card"><div class="row"><b>মাসিক আদায়</b><input id="ps" placeholder="কাস্টমার খুঁজুন" style="max-width:260px" oninput="payments()"></div><br><div class="tablewrap"><table><thead><tr><th>নাম</th><th>ফ্রিজ</th><th>ভাড়া</th><th>আদায়</th><th>বাকি</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead><tbody id="pr"></tbody></table></div></div></section>
<section id="expenses" class="hidden"><div class="card"><h3>এই মাসের খরচ</h3><div class="formgrid"><div><label>খরচের নাম</label><input id="en" placeholder="দোকান ভাড়া"></div><div><label>টাকা</label><input id="ea" type="number"></div><div><label>নোট</label><input id="eno"></div></div><br><button onclick="expense()">➕ Save</button></div><div class="card"><b>খরচের তালিকা</b><div class="tablewrap"><table><thead><tr><th>খরচ</th><th>টাকা</th><th>নোট</th><th></th></tr></thead><tbody id="er"></tbody></table></div></div></section>
</div>
<script>
const K="limon_offline_v1";let db=JSON.parse(localStorage.getItem(K)||'{"customers":[],"payments":{},"expenses":[]}');const $=x=>document.getElementById(x);
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function money(x){return"৳"+Number(x||0).toLocaleString("en-BD")}function ym(){return $("month").value}
function tab(x){["dash","customers","payments","expenses"].forEach(y=>$(y).classList.toggle("hidden",y!==x));render()}
function add(){let name=$("n").value.trim();if(!name)return alert("নাম দিন");db.customers.push({id:Date.now(),name,phone:$("ph").value,fridge:$("fr").value,brand:$("br").value,rent:+$("rent").value||0,advance:+$("adv").value||0});["n","ph","fr","br"].forEach(x=>$(x).value="");save();tab("customers")}
function del(id){if(confirm("মুছে ফেলবেন?")){db.customers=db.customers.filter(c=>c.id!=id);Object.keys(db.payments).forEach(m=>delete db.payments[m][id]);save()}}
function customers(){let q=($("search")?.value||"").toLowerCase();$("cr").innerHTML=db.customers.filter(c=>(c.name+c.phone+c.fridge).toLowerCase().includes(q)).map(c=>`<tr><td><b>${e(c.name)}</b><br><span class="small">${e(c.brand)}</span></td><td>${e(c.phone)}</td><td>${e(c.fridge)}</td><td>${money(c.rent)}</td><td>${money(c.advance)}</td><td><button class="danger" onclick="del(${c.id})">Delete</button></td></tr>`).join("")||'<tr><td colspan="6">কোনো কাস্টমার নেই</td></tr>'}
function paid(id){return db.payments[ym()]?.[id]||0}
function setpay(id){let c=db.customers.find(x=>x.id==id),v=prompt(c.name+" — কত টাকা আদায় হয়েছে?",paid(id)||c.rent);if(v===null)return;db.payments[ym()]??={};db.payments[ym()][id]=Math.max(0,+v||0);save()}
function payments(){let q=($("ps")?.value||"").toLowerCase();$("pr").innerHTML=db.customers.filter(c=>(c.name+c.phone+c.fridge).toLowerCase().includes(q)).map(c=>{let p=paid(c.id),d=Math.max(0,c.rent-p);return`<tr><td>${e(c.name)}</td><td>${e(c.fridge)}</td><td>${money(c.rent)}</td><td>${money(p)}</td><td>${money(d)}</td><td><span class="badge ${d?"due":"paid"}">${d?"বাকি":"পরিশোধ"}</span></td><td><button class="${d?"":"green"}" onclick="setpay(${c.id})">${p?"Edit":"আদায়"}</button></td></tr>`}).join("")||'<tr><td colspan="7">কোনো কাস্টমার নেই</td></tr>'}
function expense(){let name=$("en").value.trim(),a=+$("ea").value||0;if(!name||a<=0)return alert("খরচের নাম ও টাকা দিন");db.expenses.push({id:Date.now(),month:ym(),name,amount:a,note:$("eno").value});$("en").value=$("ea").value=$("eno").value="";save()}
function delex(id){db.expenses=db.expenses.filter(x=>x.id!=id);save()}
function expenses(){let a=db.expenses.filter(x=>x.month==ym());$("er").innerHTML=a.map(x=>`<tr><td>${e(x.name)}</td><td>${money(x.amount)}</td><td>${e(x.note)}</td><td><button class="danger" onclick="delex(${x.id})">Delete</button></td></tr>`).join("")||'<tr><td colspan="4">এই মাসে কোনো খরচ নেই</td></tr>'}
function dash(){let t=0,p=0;db.customers.forEach(c=>{t+=c.rent;p+=paid(c.id)});let d=Math.max(0,t-p),x=db.expenses.filter(z=>z.month==ym()).reduce((a,z)=>a+z.amount,0);$("sc").textContent=db.customers.length;$("sr").textContent=money(t);$("sp").textContent=money(p);$("sd").textContent=money(d);$("sum").innerHTML=`ভাড়া ${money(t)} | আদায় ${money(p)} | বাকি ${money(d)} | খরচ ${money(x)} | নেট ${money(p-x)}`}
function render(){if(!$("month").value){let d=new Date();$("month").value=d.toISOString().slice(0,7)}dash();customers();payments();expenses()}
function e(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="limon-refrigerator-backup.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert("Restore হয়েছে")}catch(x){alert("Backup ভুল")}};r.readAsText(i.files[0])};i.click()}
render();
</script></body></html>
